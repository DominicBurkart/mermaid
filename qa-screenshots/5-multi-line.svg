<svg id="diagram-5-multi-line" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#diagram-5-multi-line{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-5-multi-line .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-5-multi-line .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-5-multi-line .error-icon{fill:#552222;}#diagram-5-multi-line .error-text{fill:#552222;stroke:#552222;}#diagram-5-multi-line .edge-thickness-normal{stroke-width:1px;}#diagram-5-multi-line .edge-thickness-thick{stroke-width:3.5px;}#diagram-5-multi-line .edge-pattern-solid{stroke-dasharray:0;}#diagram-5-multi-line .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-5-multi-line .edge-pattern-dashed{stroke-dasharray:3;}#diagram-5-multi-line .edge-pattern-dotted{stroke-dasharray:2;}#diagram-5-multi-line .marker{fill:#000000;stroke:#000000;}#diagram-5-multi-line .marker.cross{stroke:#000000;}#diagram-5-multi-line svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#diagram-5-multi-line p{margin:0;}#diagram-5-multi-line .node .neo-node{stroke:#13540c;}#diagram-5-multi-line [data-look="neo"].node rect,#diagram-5-multi-line [data-look="neo"].cluster rect,#diagram-5-multi-line [data-look="neo"].node polygon{stroke:url(#diagram-5-multi-line-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#diagram-5-multi-line [data-look="neo"].node path{stroke:url(#diagram-5-multi-line-gradient);stroke-width:1px;}#diagram-5-multi-line [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#diagram-5-multi-lin