<svg id="diagram-4-horizontal" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#diagram-4-horizontal{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-4-horizontal .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-4-horizontal .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-4-horizontal .error-icon{fill:#552222;}#diagram-4-horizontal .error-text{fill:#552222;stroke:#552222;}#diagram-4-horizontal .edge-thickness-normal{stroke-width:1px;}#diagram-4-horizontal .edge-thickness-thick{stroke-width:3.5px;}#diagram-4-horizontal .edge-pattern-solid{stroke-dasharray:0;}#diagram-4-horizontal .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-4-horizontal .edge-pattern-dashed{stroke-dasharray:3;}#diagram-4-horizontal .edge-pattern-dotted{stroke-dasharray:2;}#diagram-4-horizontal .marker{fill:#000000;stroke:#000000;}#diagram-4-horizontal .marker.cross{stroke:#000000;}#diagram-4-horizontal svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#diagram-4-horizontal p{margin:0;}#diagram-4-horizontal .node .neo-node{stroke:#13540c;}#diagram-4-horizontal [data-look="neo"].node rect,#diagram-4-horizontal [data-look="neo"].cluster rect,#diagram-4-horizontal [data-look="neo"].node polygon{stroke:url(#diagram-4-horizontal-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#diagram-4-horizontal [data-look="neo"].node path{stroke:url(#diagram-4-horizontal-gradient);stroke-width:1px;}#diagram-4-horizontal [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,0.5));}#diagram-4-horizonta